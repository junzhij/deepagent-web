[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepagent-web"
version = "0.1.0"
description = "A web-based visualiser for LangChain Deep Agents: plans, subagents, tool calls and the virtual filesystem, live or replayed."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "deepagents>=0.7",
    "langchain>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic"]
openai = ["langchain-openai"]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
deepagent-web = "deepagent_web.__main__:main"

[tool.setuptools.packages.find]
include = ["deepagent_web*"]

[tool.setuptools.package-data]
deepagent_web = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
